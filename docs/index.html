<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon Radar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #1B1710;
    --khaki: #DCCFA1;
    --khaki-alt: #CBB98A;
    --accent: #C1440E;
    --red: #C0483D;
    --green: #6E8F52;
    --yellow: #D9B94B;
    --bg: #FFFFFF;
    --white: #FFFFFF;
    --muted: rgba(27, 23, 16, 0.62);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    width: 100%;
  }

  a {
    color: inherit;
  }

  .wrap {
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    padding: 56px clamp(20px, 4vw, 56px) 80px;
  }

  header {
    margin-bottom: 32px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: var(--white);
    border: 2px solid var(--ink);
    padding: 6px 14px;
    border-radius: 6px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .eyebrow .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  h1 {
    font-family: 'Anton', 'IBM Plex Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 5.5vw, 54px);
    margin: 0 0 12px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .sub {
    color: var(--muted);
    font-size: 14.5px;
    margin: 0;
    max-width: 620px;
    line-height: 1.5;
  }

  .sub b {
    color: var(--accent);
    font-weight: 600;
  }

  /* Standalone controls */

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .search-block {
    margin: 32px 0 14px;
  }

  #search {
    width: 100%;
    background: var(--white);
    border: 2.5px solid var(--ink);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    outline: none;
  }

  #search::placeholder {
    color: rgba(27, 23, 16, 0.45);
  }

  #search:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    margin-bottom: 8px;
    gap: 8px;
  }

  .chip {
    background: var(--white);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    transition: background 0.15s, color 0.15s;
  }

  .chip:hover {
    background: var(--khaki);
  }

  .chip.active {
    color: var(--white);
    background: var(--ink);
    border-color: var(--ink);
  }

  .count-line {
    color: var(--muted);
    font-size: 13px;
    margin: 20px 2px 14px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Hackathon cards */

  .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 26px;
  }

  .card {
    background: var(--khaki);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 8px 8px 0 var(--ink);
    padding: 22px 24px 18px;
    display: flex;
    flex-direction: column;
    transition: background 0.15s, color 0.15s;
  }

  .card.status-not_interested {
    background: var(--red);
    color: var(--white);
  }

  .card.status-participated {
    background: var(--green);
    color: var(--white);
  }

  .card.status-consider {
    background: var(--yellow);
    color: var(--ink);
  }

  .card.status-not_interested .card-desc,
  .card.status-participated .card-desc {
    color: rgba(255, 255, 255, 0.85);
  }

  .card.status-not_interested .id-badge,
  .card.status-participated .id-badge,
  .card.status-consider .id-badge {
    background: var(--white);
    color: var(--ink);
  }

  .card.status-not_interested .category,
  .card.status-participated .category {
    color: var(--white);
  }

  .card.status-consider .category {
    color: var(--ink);
    opacity: 0.75;
  }

  .card.status-not_interested .dot,
  .card.status-participated .dot {
    border-color: rgba(255, 255, 255, 0.55);
  }

  .card.status-not_interested .card-title:hover,
  .card.status-participated .card-title:hover {
    text-decoration-color: var(--white);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .id-badge {
    background: var(--white);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .category {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: right;
    line-height: 1.4;
  }

  .card-title {
    font-family: 'Anton', 'IBM Plex Sans', sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.18;
    text-transform: uppercase;
    text-decoration: none;
    color: inherit;
    display: block;
  }

  .card-title:hover {
    text-decoration: underline;
  }

  .card-desc {
    margin: 14px 0 0;
    font-size: 15.5px;
    line-height: 1.55;
    color: rgba(27, 23, 16, 0.7);
    flex-grow: 1;
  }

  .card-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 3px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-dots {
    display: flex;
    gap: 10px;
  }

  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(27, 23, 16, 0.35);
    background: var(--white);
    padding: 0;
    cursor: pointer;
  }

  .dot-red.active {
    background: var(--red);
    border-color: var(--red);
  }

  .dot-green.active {
    background: var(--green);
    border-color: var(--green);
  }

  .dot-yellow.active {
    background: var(--yellow);
    border-color: var(--yellow);
  }

  .open-btn {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    font-size: 17px;
    flex-shrink: 0;
  }

  .open-btn:hover {
    background: var(--khaki);
  }

  .empty {
    grid-column: 1 / -1;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 60px 24px;
    text-align: center;
    color: var(--ink);
  }

  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (max-width: 520px) {
    .list {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>
  <div class="wrap">

    <header>
      <div class="eyebrow">
        <span class="dot"></span>
        Live from Devpost
      </div>

      <h1>Hackathon Radar</h1>

      <p class="sub">
        Listings filtered to what's worth your time.
        Refreshed daily — last run
        <b id="generated-at">—</b>.
      </p>
    </header>

    <div class="search-block">
      <input
        id="search"
        type="text"
        placeholder="Search title or theme…"
      >
    </div>

    <div class="row chips-row" id="theme-chips"></div>

    <p class="count-line" id="count-line"></p>

    <div class="list" id="list">
      <div class="empty">Loading…</div>
    </div>

    <footer>
      Source: Devpost. Not affiliated with Devpost, Inc.
    </footer>

  </div>

<script>
  let ALL = [];
  let activeTheme = null;

  // --- per-hackathon status (not interested / participated / consider),
  // persisted in this browser only ---
  const STATUS_KEY = 'hackathonRadarStatuses';

  function loadStatuses() {
    try {
      return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}');
    } catch {
      return {};
    }
  }

  function saveStatuses(obj) {
    try {
      localStorage.setItem(STATUS_KEY, JSON.stringify(obj));
    } catch {
      // storage unavailable — status just won't persist across reloads
    }
  }

  let STATUSES = loadStatuses();

  function daysLeft(iso) {
    if (!iso) return null;

    const d = new Date(iso);
    const now = new Date();

    return Math.ceil(
      (d - now) / (1000 * 60 * 60 * 24)
    );
  }

  function deadlineLabel(iso) {
    const days = daysLeft(iso);

    if (days === null) {
      return {
        text: 'no deadline listed',
        cls: 'unknown'
      };
    }

    if (days < 0) {
      return {
        text: 'closed',
        cls: 'unknown'
      };
    }

    if (days === 0) {
      return {
        text: 'closes today',
        cls: ''
      };
    }

    return {
      text: `${days}d left`,
      cls: ''
    };
  }

  function buildCategory(h) {
    if (h.themes && h.themes.length) {
      return h.themes.slice(0, 2).join(' / ');
    }
    return h.mode || 'Hackathon';
  }

  function buildDesc(h) {
    const parts = [];

    if (h.mode) {
      parts.push(h.mode === 'online' ? 'Online' : h.mode === 'offline' ? 'In-person' : h.mode);
    }
    if (h.location) parts.push(h.location);
    if (h.prize_text) parts.push(`${h.prize_text} in prizes`);
    if (h.participants) parts.push(`${h.participants.toLocaleString()} participants`);

    return parts.length ? parts.join(' · ') : 'Details on Devpost.';
  }

  function render() {
    const q = document
      .getElementById('search')
      .value
      .trim()
      .toLowerCase();

    const list = document.getElementById('list');

    let items = ALL.filter(h => {
      if (
        activeTheme &&
        !h.themes.map(t => t.toLowerCase()).includes(activeTheme)
      ) {
        return false;
      }

      if (!q) return true;

      const haystack = (
        h.title + ' ' + h.themes.join(' ')
      ).toLowerCase();

      return haystack.includes(q);
    });

    document.getElementById('count-line').textContent =
      `${items.length} of ${ALL.length} hackathon${ALL.length === 1 ? '' : 's'}`;

    if (items.length === 0) {
      list.innerHTML = `
        <div class="empty">
          Nothing matches. Try a different search or clear the theme filter.
        </div>
      `;
      return;
    }

    list.innerHTML = items.map(h => {
      const dl = deadlineLabel(h.deadline);
      const status = STATUSES[h.url] || null;

      return `
        <div class="card${status ? ' status-' + status : ''}" data-key="${escapeAttr(h.url)}">

          <div class="card-top">
            <div class="id-badge">${escapeHtml(dl.text)}</div>
            <div class="category">${escapeHtml(buildCategory(h))}</div>
          </div>

          <a
            class="card-title"
            href="${escapeAttr(h.url)}"
            target="_blank"
            rel="noopener"
          >
            ${escapeHtml(h.title)}
          </a>

          <p class="card-desc">${escapeHtml(buildDesc(h))}</p>

          <div class="card-footer">
            <div class="status-dots">
              <button
                class="dot dot-red${status === 'not_interested' ? ' active' : ''}"
                data-status="not_interested"
                title="Not interested"
                aria-label="Mark as not interested"
              ></button>
              <button
                class="dot dot-green${status === 'participated' ? ' active' : ''}"
                data-status="participated"
                title="Already participated"
                aria-label="Mark as already participated"
              ></button>
              <button
                class="dot dot-yellow${status === 'consider' ? ' active' : ''}"
                data-status="consider"
                title="Will consider"
                aria-label="Mark as will consider"
              ></button>
            </div>

            <a
              class="open-btn"
              href="${escapeAttr(h.url)}"
              target="_blank"
              rel="noopener"
              aria-label="Open on Devpost"
            >→</a>
          </div>

        </div>
      `;
    }).join('');
  }

  function escapeHtml(s) {
    return (s || '').replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c])
    );
  }

  function escapeAttr(s) {
    return escapeHtml(s);
  }

  function buildChips() {
    const counts = {};

    ALL.forEach(h => {
      h.themes.forEach(t => {
        const key = t.toLowerCase();

        counts[key] = (counts[key] || 0) + 1;
      });
    });

    const top = Object.entries(counts)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8);

    const container = document.getElementById('theme-chips');

    container.innerHTML = top.map(([theme]) =>
      `<button class="chip" data-theme="${escapeAttr(theme)}">${escapeHtml(theme)}</button>`
    ).join('');

    container.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.theme;

        activeTheme =
          activeTheme === theme ? null : theme;

        container.querySelectorAll('.chip').forEach(b => {
          b.classList.toggle(
            'active',
            b.dataset.theme === activeTheme
          );
        });

        render();
      });
    });
  }

  // Event delegation on the list: clicking a status dot toggles that
  // hackathon's status and updates just that card, without a full re-render.
  document.getElementById('list').addEventListener('click', (e) => {
    const dot = e.target.closest('.dot');
    if (!dot) return;

    const card = dot.closest('.card');
    if (!card) return;

    const key = card.dataset.key;
    const clickedStatus = dot.dataset.status;
    const current = STATUSES[key] || null;
    const next = current === clickedStatus ? null : clickedStatus;

    if (next) {
      STATUSES[key] = next;
    } else {
      delete STATUSES[key];
    }
    saveStatuses(STATUSES);

    card.classList.remove('status-not_interested', 'status-participated', 'status-consider');
    if (next) card.classList.add('status-' + next);

    card.querySelectorAll('.dot').forEach(d => {
      d.classList.toggle('active', d.dataset.status === next);
    });
  });

  fetch('hackathons.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      ALL = data.hackathons || [];

      const gen = document.getElementById('generated-at');

      if (data.generated_at) {
        gen.textContent = new Date(
          data.generated_at
        ).toLocaleString();
      }

      buildChips();
      render();
    })
    .catch(() => {
      document.getElementById('list').innerHTML = `
        <div class="empty">
          Could not load hackathons.json —
          has the GitHub Action run yet?
        </div>
      `;
    });

  document
    .getElementById('search')
    .addEventListener('input', render);
</script>

</body>
</html>
