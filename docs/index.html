<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #13737A;
    --teal-deep: #0A2E31;
    --peach: #FBCA89;
    --bg-0: #071B1D;
    --bg-1: #0C2A2D;
    --text: #F3F1EA;
    --muted: #9FC0C1;
    --glass-bg: rgba(255, 255, 255, 0.07);
    --glass-bg-hover: rgba(255, 255, 255, 0.11);
    --glass-border: rgba(251, 202, 137, 0.18);
    --danger: #F08C6A;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }

  /* ambient glow blobs behind everything, so glass cards have something to blur */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 560px; height: 560px;
    top: -180px; left: -160px;
    background: radial-gradient(circle, rgba(19,115,122,0.85), transparent 70%);
  }
  body::after {
    width: 620px; height: 620px;
    bottom: -220px; right: -200px;
    background: radial-gradient(circle, rgba(251,202,137,0.35), transparent 70%);
  }

  a { color: inherit; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 20px 80px;
  }

  header {
    margin-bottom: 32px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--peach);
    background: rgba(251, 202, 137, 0.1);
    border: 1px solid var(--glass-border);
    padding: 5px 12px;
    border-radius: 100px;
    margin-bottom: 18px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--peach);
    box-shadow: 0 0 8px var(--peach);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(34px, 5vw, 48px);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
    background: linear-gradient(100deg, var(--text) 40%, var(--peach) 110%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    color: var(--muted);
    font-size: 14.5px;
    margin: 0;
    max-width: 520px;
    line-height: 1.5;
  }

  .sub b { color: var(--text); font-weight: 500; }

  /* glass panel shared by controls + cards */
  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 16px;
  }

  .controls-panel {
    margin: 32px 0 16px;
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  #search {
    flex: 1;
    min-width: 200px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 11px 16px;
    border-radius: 10px;
    outline: none;
  }
  #search:focus { border-color: var(--peach); }
  #search::placeholder { color: var(--muted); }

  .chip {
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--glass-border);
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 9px 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--peach); }
  .chip.active {
    color: var(--teal-deep);
    background: var(--peach);
    border-color: var(--peach);
    font-weight: 500;
  }

  .count-line {
    color: var(--muted);
    font-size: 13px;
    margin: 20px 4px 14px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    padding: 20px 22px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 20px;
    transition: background 0.15s, transform 0.15s, border-color 0.15s;
  }
  .card:hover {
    background: var(--glass-bg-hover);
    border-color: rgba(251, 202, 137, 0.4);
    transform: translateY(-1px);
  }

  .row-title {
    font-size: 17px;
    font-weight: 500;
    text-decoration: none;
    line-height: 1.35;
    color: var(--text);
  }
  .row-title:hover { color: var(--peach); }

  .row-meta {
    grid-column: 1;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-top: 2px;
  }

  .row-deadline {
    grid-row: 1 / 3;
    grid-column: 2;
    text-align: right;
    align-self: start;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid transparent;
  }
  .row-deadline.soon { color: var(--danger); border-color: rgba(240,140,106,0.4); background: rgba(240,140,106,0.08); }
  .row-deadline.ok { color: var(--peach); border-color: rgba(251,202,137,0.35); background: rgba(251,202,137,0.08); }
  .row-deadline.unknown { color: var(--muted); }

  .tags {
    grid-column: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .tag {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--glass-border);
    background: rgba(19, 115, 122, 0.18);
    padding: 3px 10px;
    border-radius: 100px;
  }

  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--muted);
  }

  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (max-width: 520px) {
    .card { grid-template-columns: 1fr; }
    .row-deadline { grid-row: auto; grid-column: 1; text-align: left; padding: 3px 0; background: none !important; border: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow"><span class="dot"></span>Live from Devpost</div>
      <h1>Hackathon Radar</h1>
      <p class="sub">Listings filtered to what's worth your time. Refreshed daily — last run <b id="generated-at">—</b>.</p>
    </header>

    <div class="controls-panel glass">
      <input id="search" type="text" placeholder="Search title or theme…">
    </div>
    <div class="controls-panel glass" id="theme-chips" style="margin-top:0;"></div>

    <p class="count-line" id="count-line"></p>

    <div class="list" id="list">
      <div class="empty glass">Loading…</div>
    </div>

    <footer>Source: Devpost. Not affiliated with Devpost, Inc.</footer>
  </div>

<script>
  let ALL = [];
  let activeTheme = null;

  function daysLeft(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    const now = new Date();
    return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
  }

  function deadlineLabel(iso) {
    const days = daysLeft(iso);
    if (days === null) return { text: 'no deadline listed', cls: 'unknown' };
    if (days < 0) return { text: 'closed', cls: 'unknown' };
    if (days === 0) return { text: 'closes today', cls: 'soon' };
    if (days <= 5) return { text: `${days}d left`, cls: 'soon' };
    return { text: `${days}d left`, cls: 'ok' };
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = document.getElementById('list');

    let items = ALL.filter(h => {
      if (activeTheme && !h.themes.map(t => t.toLowerCase()).includes(activeTheme)) return false;
      if (!q) return true;
      const haystack = (h.title + ' ' + h.themes.join(' ')).toLowerCase();
      return haystack.includes(q);
    });

    document.getElementById('count-line').textContent =
      `${items.length} of ${ALL.length} hackathon${ALL.length === 1 ? '' : 's'}`;

    if (items.length === 0) {
      list.innerHTML = '<div class="empty glass">Nothing matches. Try a different search or clear the theme filter.</div>';
      return;
    }

    list.innerHTML = items.map(h => {
      const dl = deadlineLabel(h.deadline);
      const meta = [h.mode, h.location, h.prize_text].filter(Boolean).join(' · ');
      const tags = h.themes.slice(0, 5).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      return `
        <div class="card glass">
          <a class="row-title" href="${escapeAttr(h.url)}" target="_blank" rel="noopener">${escapeHtml(h.title)}</a>
          <div class="row-deadline ${dl.cls}">${dl.text}</div>
          <div class="row-meta">${escapeHtml(meta)}</div>
          <div class="tags">${tags}</div>
        </div>`;
    }).join('');
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function buildChips() {
    const counts = {};
    ALL.forEach(h => h.themes.forEach(t => {
      const key = t.toLowerCase();
      counts[key] = (counts[key] || 0) + 1;
    }));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const container = document.getElementById('theme-chips');
    container.innerHTML = top.map(([theme]) =>
      `<button class="chip" data-theme="${escapeAttr(theme)}">${escapeHtml(theme)}</button>`
    ).join('');
    container.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.theme;
        activeTheme = activeTheme === theme ? null : theme;
        container.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.theme === activeTheme));
        render();
      });
    });
  }

  fetch('hackathons.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      ALL = data.hackathons || [];
      const gen = document.getElementById('generated-at');
      if (data.generated_at) {
        gen.textContent = new Date(data.generated_at).toLocaleString();
      }
      buildChips();
      render();
    })
    .catch(() => {
      document.getElementById('list').innerHTML =
        '<div class="empty glass">Could not load hackathons.json — has the GitHub Action run yet?</div>';
    });

  document.getElementById('search').addEventListener('input', render);
</script>
</body>
</html>
