<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon Radar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #1B1710;
    --khaki: #DCCFA1;
    --accent: #C1440E;
    --red: #C0483D;
    --green: #6E8F52;
    --yellow: #D9B94B;
    --bg: #FFFFFF;
    --white: #FFFFFF;
    --muted: rgba(27, 23, 16, 0.62);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    width: 100%;
  }

  a {
    color: inherit;
  }

  .wrap {
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    padding: 56px clamp(20px, 4vw, 56px) 80px;
  }

  header {
    margin-bottom: 32px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: var(--white);
    border: 2px solid var(--ink);
    padding: 6px 14px;
    border-radius: 6px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .eyebrow .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  #sync-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    margin-left: 10px;
    padding: 5px 10px;
    border-radius: 5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  #sync-status.ok {
    background: #E4EEDD;
    color: var(--green);
  }

  #sync-status.warn {
    background: #F6E3DD;
    color: var(--red);
  }

  h1 {
    font-family: 'Anton', 'IBM Plex Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 5.5vw, 54px);
    margin: 0 0 12px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .sub {
    color: var(--muted);
    font-size: 14.5px;
    margin: 0;
    max-width: 620px;
    line-height: 1.5;
  }

  .sub b {
    color: var(--accent);
    font-weight: 600;
  }

  /* Standalone controls */

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin: 30px 0 6px;
  }

  .tab-btn {
    background: var(--white);
    border: 2.5px solid var(--ink);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .tab-btn.active {
    background: var(--ink);
    color: var(--white);
  }

  .search-block {
    margin: 20px 0 14px;
  }

  #search {
    width: 100%;
    background: var(--white);
    border: 2.5px solid var(--ink);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    outline: none;
  }

  #search::placeholder {
    color: rgba(27, 23, 16, 0.45);
  }

  #search:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    margin-bottom: 8px;
    gap: 8px;
  }

  .chip {
    background: var(--white);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    transition: background 0.15s, color 0.15s;
  }

  .chip:hover {
    background: var(--khaki);
  }

  .chip.active {
    color: var(--white);
    background: var(--ink);
    border-color: var(--ink);
  }

  .count-line {
    color: var(--muted);
    font-size: 13px;
    margin: 20px 2px 14px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Hackathon cards */

  .list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 26px;
  }

  .card {
    background: var(--khaki);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 8px 8px 0 var(--ink);
    padding: 22px 24px 18px;
    display: flex;
    flex-direction: column;
    transition: background 0.15s, color 0.15s;
  }

  .card.status-not_interested {
    background: var(--red);
    color: var(--white);
  }

  .card.status-participated {
    background: var(--green);
    color: var(--white);
  }

  .card.status-consider {
    background: var(--yellow);
    color: var(--ink);
  }

  .card.status-not_interested .card-desc,
  .card.status-participated .card-desc {
    color: rgba(255, 255, 255, 0.85);
  }

  .card.status-not_interested .id-badge,
  .card.status-participated .id-badge,
  .card.status-consider .id-badge {
    background: var(--white);
    color: var(--ink);
  }

  .card.status-not_interested .category,
  .card.status-participated .category {
    color: var(--white);
  }

  .card.status-consider .category {
    color: var(--ink);
    opacity: 0.75;
  }

  .card.status-not_interested .dot,
  .card.status-participated .dot {
    border-color: rgba(255, 255, 255, 0.55);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .id-badge {
    background: var(--white);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .category {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: right;
    line-height: 1.4;
  }

  .card-title {
    font-family: 'Anton', 'IBM Plex Sans', sans-serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.18;
    text-transform: uppercase;
    text-decoration: none;
    color: inherit;
    display: block;
  }

  .card-title:hover {
    text-decoration: underline;
  }

  .card-desc {
    margin: 14px 0 0;
    font-size: 15.5px;
    line-height: 1.55;
    color: rgba(27, 23, 16, 0.7);
    flex-grow: 1;
  }

  .card-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 3px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-dots {
    display: flex;
    gap: 10px;
  }

  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(27, 23, 16, 0.35);
    background: var(--white);
    padding: 0;
    cursor: pointer;
  }

  .dot-red.active {
    background: var(--red);
    border-color: var(--red);
  }

  .dot-green.active {
    background: var(--green);
    border-color: var(--green);
  }

  .dot-yellow.active {
    background: var(--yellow);
    border-color: var(--yellow);
  }

  .open-btn {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    border: 2px solid var(--ink);
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    font-size: 17px;
    flex-shrink: 0;
  }

  .open-btn:hover {
    background: var(--khaki);
  }

  .empty {
    grid-column: 1 / -1;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 60px 24px;
    text-align: center;
    color: var(--ink);
  }

  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Refined visual layer: the original layout and interactions stay unchanged. */
  :root {
    --ink: #2b1d32;
    --plum: #5d3b68;
    --purple: #7657a8;
    --accent: #b84f79;
    --floral: #f7d6e2;
    --floral-strong: #e595b4;
    --lavender: #eee8f8;
    --lavender-deep: #ddd0f1;
    --sage: #dcebe1;
    --butter: #f7e5b4;
    --bg: #fbf8fc;
    --paper: #fffdfb;
    --white: #ffffff;
    --border: #dfd3e5;
    --muted: #746579;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 96% 4%, rgba(229, 149, 180, 0.22), transparent 25rem),
      radial-gradient(circle at 4% 32%, rgba(221, 208, 241, 0.28), transparent 24rem),
      var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    line-height: 1.45;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    right: 8vw;
    width: 1px;
    height: 100vh;
    background: linear-gradient(to bottom, transparent, rgba(118, 87, 168, 0.16), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1320px;
    padding-top: 48px;
    padding-bottom: 72px;
  }

  header {
    position: relative;
    padding-bottom: 30px;
    margin-bottom: 28px;
    animation: rise-in 0.7s cubic-bezier(0.2, 0.75, 0.25, 1) both;
  }

  header::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: min(260px, 42%);
    height: 3px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--floral-strong), var(--lavender-deep));
  }

  .eyebrow {
    color: var(--plum);
    background: rgba(238, 232, 248, 0.78);
    border: 1px solid var(--border);
    padding: 7px 13px;
    border-radius: 999px;
    box-shadow: 0 5px 18px rgba(93, 59, 104, 0.06);
    letter-spacing: 0.06em;
  }

  .eyebrow .dot {
    width: 8px;
    height: 8px;
    background: var(--floral-strong);
    box-shadow: 0 0 0 4px rgba(229, 149, 180, 0.18);
    animation: breathe 2.6s ease-in-out infinite;
  }

  #sync-status {
    background: rgba(255, 255, 255, 0.66);
    border: 1px solid rgba(93, 59, 104, 0.12);
    color: var(--plum);
  }

  #sync-status.ok {
    background: var(--sage);
    color: #47715a;
  }

  #sync-status.warn {
    background: var(--floral);
    color: #934464;
  }

  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(42px, 6vw, 68px);
    line-height: 0.98;
    letter-spacing: -0.055em;
    text-transform: none;
    color: var(--plum);
  }

  .sub {
    color: var(--muted);
    font-size: 15px;
    max-width: 640px;
  }

  .sub b {
    color: var(--accent);
  }

  .tabs {
    gap: 8px;
    margin-top: 26px;
    margin-bottom: 10px;
  }

  .tab-btn,
  .chip,
  #search,
  .open-btn,
  .dot {
    transition:
      background-color 180ms ease,
      border-color 180ms ease,
      color 180ms ease,
      box-shadow 180ms ease,
      transform 180ms ease;
  }

  .tab-btn {
    background: rgba(255, 253, 251, 0.72);
    border: 1px solid var(--border);
    color: var(--plum);
    padding: 10px 16px;
    border-radius: 999px;
    box-shadow: 0 3px 10px rgba(93, 59, 104, 0.04);
  }

  .tab-btn:hover {
    border-color: var(--floral-strong);
    background: var(--floral);
    transform: translateY(-2px);
  }

  .tab-btn.active {
    background: var(--plum);
    border-color: var(--plum);
    color: var(--white);
    box-shadow: 0 7px 16px rgba(93, 59, 104, 0.2);
  }

  .search-block {
    margin: 22px 0 14px;
  }

  #search {
    background: rgba(255, 253, 251, 0.88);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 15px 18px;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(93, 59, 104, 0.05);
  }

  #search::placeholder {
    color: rgba(116, 101, 121, 0.72);
  }

  #search:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 0 4px rgba(118, 87, 168, 0.14), 0 8px 24px rgba(93, 59, 104, 0.08);
  }

  .chips-row {
    gap: 7px;
    margin-bottom: 10px;
  }

  .chip {
    background: rgba(255, 253, 251, 0.62);
    border: 1px solid var(--border);
    color: var(--plum);
    padding: 8px 13px;
    border-radius: 999px;
  }

  .chip:hover {
    background: var(--lavender);
    border-color: var(--lavender-deep);
    transform: translateY(-2px);
  }

  .chip.active {
    color: var(--plum);
    background: var(--lavender-deep);
    border-color: var(--purple);
    box-shadow: 0 4px 12px rgba(118, 87, 168, 0.14);
  }

  .count-line {
    color: var(--muted);
    margin-top: 22px;
    margin-bottom: 15px;
  }

  .list {
    gap: 22px;
  }

  .card {
    position: relative;
    overflow: hidden;
    background: rgba(255, 253, 251, 0.92);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 12px 28px rgba(93, 59, 104, 0.08);
    padding: 23px 24px 19px;
    animation: card-in 0.55s cubic-bezier(0.2, 0.75, 0.25, 1) both;
    transition:
      transform 280ms cubic-bezier(0.2, 0.8, 0.25, 1),
      box-shadow 280ms ease,
      border-color 280ms ease;
    contain: layout style;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 5px;
    height: 100%;
    background: var(--floral-strong);
    opacity: 0.8;
    transition: width 280ms ease, opacity 280ms ease;
  }

  .card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 24px;
    right: 24px;
    height: 4px;
    border-radius: 0 0 999px 999px;
    background: linear-gradient(90deg, var(--hot-pink), var(--lavender-deep));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 300ms cubic-bezier(0.2, 0.8, 0.25, 1);
  }

  .card:nth-child(2) { animation-delay: 45ms; }
  .card:nth-child(3) { animation-delay: 90ms; }
  .card:nth-child(4) { animation-delay: 135ms; }
  .card:nth-child(5) { animation-delay: 180ms; }
  .card:nth-child(6) { animation-delay: 225ms; }

  .card:hover {
    border-color: #cbb8d6;
    box-shadow: 0 30px 58px rgba(93, 59, 104, 0.22);
    transform: translateY(-14px) scale(1.025);
  }

  .card:hover::before {
    width: 9px;
    opacity: 1;
  }

  .card:hover::after {
    transform: scaleX(1);
  }

  .card.status-not_interested,
  .card.status-participated,
  .card.status-consider {
    color: var(--ink);
    border-color: var(--border);
  }

  .card.status-not_interested {
    background: #f5dce5;
  }

  .card.status-not_interested::before {
    background: #cc6e91;
  }

  .card.status-participated {
    background: var(--sage);
  }

  .card.status-participated::before {
    background: #6ca27d;
  }

  .card.status-consider {
    background: var(--butter);
  }

  .card.status-consider::before {
    background: #c69d43;
  }

  .card.status-not_interested .card-desc,
  .card.status-participated .card-desc,
  .card.status-consider .card-desc {
    color: var(--muted);
  }

  .card.status-not_interested .category,
  .card.status-participated .category,
  .card.status-consider .category {
    color: var(--plum);
    opacity: 1;
  }

  .card.status-not_interested .id-badge,
  .card.status-participated .id-badge,
  .card.status-consider .id-badge {
    background: rgba(255, 255, 255, 0.76);
    color: var(--plum);
    border-color: rgba(93, 59, 104, 0.16);
  }

  .card-top {
    margin-bottom: 20px;
  }

  .id-badge {
    background: var(--lavender);
    border: 1px solid var(--lavender-deep);
    color: var(--plum);
    padding: 6px 11px;
    border-radius: 999px;
  }

  .category {
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  .card-title {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.12;
    letter-spacing: -0.035em;
  }

  .card-title:hover {
    color: var(--accent);
    text-decoration: none;
  }

  .card-desc {
    margin-top: 13px;
    font-size: 15px;
    color: var(--muted);
  }

  .card-footer {
    margin-top: 22px;
    padding-top: 15px;
    border-top: 1px solid rgba(93, 59, 104, 0.18);
  }

  .status-dots {
    gap: 8px;
  }

  .dot {
    width: 24px;
    height: 24px;
    border: 1px solid rgba(93, 59, 104, 0.2);
  }

  .dot:hover {
    transform: scale(1.12);
    box-shadow: 0 3px 9px rgba(93, 59, 104, 0.16);
  }

  .dot-red { background: #f5dce5; }
  .dot-green { background: var(--sage); }
  .dot-yellow { background: var(--butter); }

  .dot-red.active {
    background: #cc6e91;
    border-color: #cc6e91;
    box-shadow: 0 0 0 4px rgba(204, 110, 145, 0.16);
  }

  .dot-green.active {
    background: #6ca27d;
    border-color: #6ca27d;
    box-shadow: 0 0 0 4px rgba(108, 162, 125, 0.16);
  }

  .dot-yellow.active {
    background: #c69d43;
    border-color: #c69d43;
    box-shadow: 0 0 0 4px rgba(198, 157, 67, 0.16);
  }

  .open-btn {
    width: 40px;
    height: 40px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--plum);
    font-size: 19px;
  }

  .open-btn:hover {
    background: var(--plum);
    border-color: var(--plum);
    color: var(--white);
    transform: translateX(3px);
  }

  .empty {
    background: rgba(255, 253, 251, 0.72);
    border: 1px dashed var(--border);
    border-radius: 20px;
    color: var(--plum);
    padding: 64px 24px;
    animation: rise-in 0.45s ease both;
  }

  footer {
    color: var(--muted);
    opacity: 0.9;
  }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(15px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 4px rgba(229, 149, 180, 0.16); }
    50% { box-shadow: 0 0 0 7px rgba(229, 149, 180, 0.04); }
  }

  @media (max-width: 680px) {
    .wrap {
      padding-top: 32px;
    }

    .tabs {
      overflow-x: auto;
      padding: 2px 2px 8px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex-shrink: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 520px) {
    .list {
      grid-template-columns: 1fr;
    }

    h1 {
      font-size: 44px;
    }

    .card {
      padding: 20px 20px 17px;
    }
  }

  /* Final polish: warmer typography, richer contrast, a small interactive pet, and a themed cursor. */
  :root {
    --bg: #faf7fc;
    --hot-pink: #d13f80;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    cursor: auto;
  }

  body {
    background:
      radial-gradient(circle at 96% 4%, rgba(229, 149, 180, 0.23), transparent 25rem),
      radial-gradient(circle at 4% 32%, rgba(221, 208, 241, 0.29), transparent 24rem),
      radial-gradient(rgba(93, 59, 104, 0.045) 0.55px, transparent 0.55px),
      var(--bg);

  h1,

  .pet-art {
    width: 58px;

    overflow: visible;

  .pet-shell {

  .pet-eye {
    fill: var(--plum);

  .pet-smile {
    fill: none;

  .pet-bubble {
    position: absolute;
    right: calc(100% + 12px);

    max-width: 156px;

    border: 1px solid var(--border);
    border-radius: 12px 12px 4px 12px;

    font-size: 10px;

  .pet-wrap.is-talking .pet-bubble {

  @keyframes pet-hop {

  @keyframes pet-look {

  .skeleton-card {

  /* Performance guardrails: keep motion focused on what is visible and interacted with. */
  .card {
    animation: none;
    content-visibility: auto;
    contain-intrinsic-size: 280px;

  .card:nth-child(-n+6) {

  .prize-box::after {

</style>

<body>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    deleteDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  // ============================================================
  // FILL THIS IN with the config Firebase gives you:
  // Firebase console -> Project settings -> General -> Your apps -> </> (web app)
  // ============================================================
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCUy3TjVe7YO7uhiodbPbV5ZL85KjMI820",
    authDomain: "hackathon-radar-33c9d.firebaseapp.com",
    projectId: "hackathon-radar-33c9d",
    storageBucket: "hackathon-radar-33c9d.firebasestorage.app",
    messagingSenderId: "403945643871",
    appId: "1:403945643871:web:135bcee8b57e5d9cfb60ea",
    measurementId: "G-620Z5JHMZ3"
  };
  // ============================================================

  const TRACKED_COLLECTION = 'trackedHackathons';

  let db = null;
  try {
    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    }
  } catch (err) {
    console.warn('Firebase failed to initialize:', err);
  }

  function setSyncBadge(state) {
    const el = document.getElementById('sync-status');
    if (state === 'ok') {
      el.textContent = 'synced';
      el.className = 'ok';
    } else {
      el.textContent = 'sync not set up';
      el.className = 'warn';
    }
  }

  let ALL = [];
  let TRACKED = {}; // url -> { status, snapshot, updatedAt }
  let activeTheme = null;
  let activeTab = 'all'; // 'all' | 'devpost' | 'unstop' | 'mine'

  function docIdFor(url) {
    return encodeURIComponent(url);
  }

  function subscribeTracked() {
    if (!db) {
      setSyncBadge('warn');
      return;
    }
    setSyncBadge('ok');
    onSnapshot(
      collection(db, TRACKED_COLLECTION),
      (snap) => {
        TRACKED = {};
        snap.forEach((docSnap) => {
          const data = docSnap.data();
          if (data && data.snapshot && data.snapshot.url) {
            TRACKED[data.snapshot.url] = data;
          }
        });
        pruneExpired();
        render();
      },
      (err) => {
        console.warn('Firestore subscription error:', err);
        setSyncBadge('warn');
      }
    );
  }

  async function setStatus(hackathon, status) {
    if (!db) {
      alert("Cloud sync isn't set up yet — add your Firebase config in the page's <script> section.");
      return;
    }
    await setDoc(doc(db, TRACKED_COLLECTION, docIdFor(hackathon.url)), {
      status,
      snapshot: hackathon,
      updatedAt: new Date().toISOString()
    });
  }

  async function clearStatus(url) {
    if (!db) return;
    await deleteDoc(doc(db, TRACKED_COLLECTION, docIdFor(url)));
  }

  function pruneExpired() {
    const now = new Date();
    Object.values(TRACKED).forEach((t) => {
      const dl = t.snapshot && t.snapshot.deadline;
      if (dl && new Date(dl) < now) {
        clearStatus(t.snapshot.url);
      }
    });
  }

  function daysLeft(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    const now = new Date();
    return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
  }

  function deadlineLabel(iso) {
    const days = daysLeft(iso);
    if (days === null) return { text: 'no deadline listed', cls: 'unknown', tone: 'unknown' };
    if (days < 0) return { text: 'closed', cls: 'unknown', tone: 'closed' };
    if (days <= 2) return { text: days === 0 ? 'closes today' : `${days}d left`, cls: '', tone: 'urgent' };
    if (days <= 7) return { text: `${days}d left`, cls: '', tone: 'soon' };
    if (days <= 21) return { text: `${days}d left`, cls: '', tone: 'steady' };
    return { text: `${days}d left`, cls: '', tone: 'open' };
  }

  function buildCategory(h) {
    if (h.themes && h.themes.length) return h.themes.slice(0, 2).join(' / ');
    return h.mode || 'Hackathon';
  }

  function buildSourceLabel(h) {
    const source = (h.source || '').toLowerCase();
    if (source === 'devpost') return 'Devpost listing';
    if (source === 'unstop') return 'Unstop listing';
    return 'Hackathon listing';
  }

  function getCollege(h) {
    return h.college || h.organizer || h.organization_name || h.organization || h.host || '';
  }

  function buildDesc(h) {
    const parts = [];
    if (h.mode) parts.push(h.mode === 'online' ? 'Online' : h.mode === 'offline' ? 'In-person' : h.mode);
    if (h.location) parts.push(h.location);
    if (h.participants) parts.push(`${h.participants.toLocaleString()} participants`);
    return parts.length ? parts.join(' · ') : 'Details on Devpost.';
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function escapeAttr(s) {
    return escapeHtml(s);
  }

  function getStatus(url) {
    return (TRACKED[url] && TRACKED[url].status) || null;
  }

  function currentSourceList() {
  if (activeTab === 'mine') {
    return Object.values(TRACKED)
      .filter((t) => t.status === 'participated' || t.status === 'consider')
      .map((t) => t.snapshot);
  }

  if (activeTab === 'devpost' || activeTab === 'unstop') {
    return ALL.filter((h) => h.source === activeTab);
  }

  return ALL;
}

  function resetFilters() {
    activeTheme = null;
    activeTab = 'all';
    document.getElementById('search').value = '';
    document.querySelectorAll('#tabs .tab-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tab === 'all');
    });
    document.querySelectorAll('#theme-chips .chip').forEach((chip) => {
      chip.classList.remove('active');
    });
    render();
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = document.getElementById('list');
    const source = currentSourceList();
    const clearFilters = document.getElementById('clear-filters');

    let items = source.filter((h) => {
      if (activeTheme && !h.themes.map((t) => t.toLowerCase()).includes(activeTheme)) return false;
      if (!q) return true;
      const haystack = (h.title + ' ' + h.themes.join(' ')).toLowerCase();
      return haystack.includes(q);
    });

    document.getElementById('count-line').textContent =
      `${items.length} of ${source.length} hackathon${source.length === 1 ? '' : 's'}`;
    clearFilters.hidden = !(q || activeTheme || activeTab !== 'all');

    if (items.length === 0) {
      if (activeTab === 'mine' && source.length === 0) {
        list.innerHTML = `
          <div class="empty empty-mine">
            <span class="empty-kicker">MY HACKATHONS</span>
            <strong>Nothing saved yet</strong>
            <p>Mark a listing as “will consider” or “participated” to collect it here.</p>
          </div>
        `;
      } else if (source.length === 0) {
        list.innerHTML = `
          <div class="empty empty-source">
            <span class="empty-kicker">${escapeHtml(activeTab.toUpperCase())}</span>
            <strong>No listings here yet</strong>
            <p>Try another source or return to all hackathons.</p>
            <button class="clear-inline" type="button">Show all hackathons</button>
          </div>
        `;
      } else {
        list.innerHTML = `
          <div class="empty empty-results">
            <span class="empty-kicker">NO MATCHES</span>
            <strong>Try a wider search</strong>
            <p>Nothing matches the current search and theme combination.</p>
            <button class="clear-inline" type="button">Clear filters</button>
          </div>
        `;
      }
      return;
    }

    list.innerHTML = items.map((h) => {
      const dl = deadlineLabel(h.deadline);
      const status = getStatus(h.url);

      return `
        <div class="card${status ? ' status-' + status : ''}" data-key="${escapeAttr(h.url)}">

          <div class="card-top">
            <div class="id-badge deadline-${dl.tone}">${escapeHtml(dl.text)}</div>
            <div class="category">${escapeHtml(buildCategory(h))}</div>
          </div>

          <div class="card-source"><span class="source-dot"></span>${escapeHtml(buildSourceLabel(h))}</div>

          <a class="card-title" href="${escapeAttr(h.url)}" target="_blank" rel="noopener">
            ${escapeHtml(h.title)}
          </a>

          ${getCollege(h) ? `<div class="college-box"><span class="college-icon">🎓</span><span class="college-name">${escapeHtml(getCollege(h))}</span></div>` : ''}

          <p class="card-desc">${escapeHtml(buildDesc(h))}</p>

          ${h.prize_text ? `<div class="prize-box"><span class="prize-label">🏆 Prize pool</span><span class="prize-amount">${escapeHtml(h.prize_text)}</span></div>` : ''}

          <div class="card-footer">
            <div class="status-dots">
              <button class="dot dot-red${status === 'not_interested' ? ' active' : ''}" data-status="not_interested" title="Not interested" aria-label="Mark as not interested"></button>
              <button class="dot dot-green${status === 'participated' ? ' active' : ''}" data-status="participated" title="Already participated" aria-label="Mark as already participated"></button>
              <button class="dot dot-yellow${status === 'consider' ? ' active' : ''}" data-status="consider" title="Will consider" aria-label="Mark as will consider"></button>
            </div>
            <a class="open-btn" href="${escapeAttr(h.url)}" target="_blank" rel="noopener" aria-label="Open listing">
              <span class="open-label">Open listing</span>
              <span class="open-icon">→</span>
            </a>
          </div>

        </div>
      `;
    }).join('');
  }

  function buildChips() {
    const counts = {};
    ALL.forEach((h) => {
      h.themes.forEach((t) => {
        const key = t.toLowerCase();
        counts[key] = (counts[key] || 0) + 1;
      });
    });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const container = document.getElementById('theme-chips');
    container.innerHTML = top.map(([theme]) =>
      `<button class="chip" data-theme="${escapeAttr(theme)}">${escapeHtml(theme)}</button>`
    ).join('');
    container.querySelectorAll('.chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.theme;
        activeTheme = activeTheme === theme ? null : theme;
        container.querySelectorAll('.chip').forEach((b) => {
          b.classList.toggle('active', b.dataset.theme === activeTheme);
        });
        render();
      });
    });
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b === btn));
    render();
  });

  document.getElementById('clear-filters').addEventListener('click', resetFilters);

  document.getElementById('list').addEventListener('click', (e) => {
    const clearInline = e.target.closest('.clear-inline');
    if (clearInline) {
      resetFilters();
      return;
    }

    const dot = e.target.closest('.dot');
    if (!dot) return;
    const card = dot.closest('.card');
    const url = card.dataset.key;
    const clickedStatus = dot.dataset.status;
    const current = getStatus(url);

    if (current === clickedStatus) {
      clearStatus(url);
    } else {
      const hackathon = ALL.find((h) => h.url === url) || (TRACKED[url] && TRACKED[url].snapshot);
      if (hackathon) setStatus(hackathon, clickedStatus);
    }
  });

  fetch('hackathons.json?_=' + Date.now())
    .then((r) => r.json())
    .then((data) => {
      ALL = data.hackathons || [];
      const gen = document.getElementById('generated-at');
      if (data.generated_at) gen.textContent = new Date(data.generated_at).toLocaleString();
      buildChips();
      render();
    })
    .catch(() => {
      document.getElementById('list').innerHTML = `
        <div class="empty empty-error">
          <span class="empty-kicker">DATA UNAVAILABLE</span>
          <strong>Couldn’t load listings</strong>
          <p>Check that hackathons.json exists and that the data refresh has run.</p>
        </div>
      `;
    });

  document.getElementById('search').addEventListener('input', render);

  const petWrap = document.getElementById('pet-wrap');
  const pet = document.getElementById('site-pet');
  const petBubble = document.getElementById('pet-bubble');
  const petMessages = [
    'slow and steady wins.',
    'good luck, builder.',
    'shell yeah!',
    'one idea at a time.'
  ];
  let petMessageIndex = 0;
  let petTimer;

  pet.addEventListener('click', () => {
    petMessageIndex = (petMessageIndex + 1) % petMessages.length;
    petBubble.textContent = petMessages[petMessageIndex];
    petWrap.classList.add('is-talking');
    pet.classList.remove('is-happy');
    requestAnimationFrame(() => pet.classList.add('is-happy'));
    clearTimeout(petTimer);
    petTimer = setTimeout(() => petWrap.classList.remove('is-talking'), 2400);
  });

  subscribeTracked();
</script>

</body>
</html>
