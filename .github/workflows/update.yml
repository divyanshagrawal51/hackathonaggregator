name: Update hackathon list

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily (~8:30 AM IST)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and export
        run: python export_json.py

      - name: Commit updated hackathons.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/hackathons.json
          git diff --quiet --cached || git commit -m "Update hackathon list"
          git push