name: Update hackathon list

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily (~8:30 AM IST)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and export
        run: |
          # Devpost sometimes rate-limits GitHub's shared runner IPs (HTTP 429),
          # so retry the whole export a few times before giving up.
          for i in 1 2 3; do
            python export_json.py && exit 0
            echo "Attempt $i failed; waiting before retry..."
            sleep $((i * 120))
          done
          exit 1

      - name: Commit updated hackathons.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/hackathons.json
          git diff --quiet --cached || git commit -m "Update hackathon list"
          git push
