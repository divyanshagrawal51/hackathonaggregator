<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1013;
    --panel: #14171C;
    --border: #262A32;
    --text: #EDEAE3;
    --muted: #8B909A;
    --gold: #E8B04B;
    --teal: #6FD6C4;
    --danger: #E2705C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }

  a { color: inherit; }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  header {
    margin-bottom: 36px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 5vw, 44px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }

  .sub span { color: var(--text); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 28px 0 8px;
  }

  #search {
    flex: 1;
    min-width: 200px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
  }
  #search:focus { border-color: var(--gold); }
  #search::placeholder { color: var(--muted); }

  .chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover { color: var(--text); border-color: #3A3F49; }
  .chip.active { color: var(--bg); background: var(--gold); border-color: var(--gold); }

  .count-line {
    color: var(--muted);
    font-size: 13px;
    margin: 20px 0 4px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .list {
    border-top: 1px solid var(--border);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 20px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
  }

  .row-title {
    font-size: 17px;
    font-weight: 500;
    text-decoration: none;
    line-height: 1.3;
  }
  .row-title:hover { color: var(--gold); }

  .row-meta {
    grid-column: 1;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }

  .row-deadline {
    grid-row: 1 / 3;
    grid-column: 2;
    text-align: right;
    align-self: start;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    white-space: nowrap;
    padding-top: 3px;
  }
  .row-deadline.soon { color: var(--danger); }
  .row-deadline.ok { color: var(--teal); }
  .row-deadline.unknown { color: var(--muted); }

  .tags {
    grid-column: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .tag {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 100px;
  }

  .empty {
    padding: 60px 0;
    text-align: center;
    color: var(--muted);
  }

  footer {
    margin-top: 40px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr; }
    .row-deadline { grid-row: auto; grid-column: 1; text-align: left; padding-top: 6px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Hackathon Radar</h1>
      <p class="sub">Devpost listings, filtered to what's worth your time. Refreshed daily — last run <span id="generated-at">—</span>.</p>
    </header>

    <div class="controls">
      <input id="search" type="text" placeholder="Search title or theme…">
    </div>
    <div class="controls" id="theme-chips"></div>

    <p class="count-line" id="count-line"></p>

    <div class="list" id="list">
      <div class="empty">Loading…</div>
    </div>

    <footer>Source: Devpost. Not affiliated with Devpost, Inc.</footer>
  </div>

<script>
  let ALL = [];
  let activeTheme = null;

  function daysLeft(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    const now = new Date();
    return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
  }

  function deadlineLabel(iso) {
    const days = daysLeft(iso);
    if (days === null) return { text: 'no deadline listed', cls: 'unknown' };
    if (days < 0) return { text: 'closed', cls: 'unknown' };
    if (days === 0) return { text: 'closes today', cls: 'soon' };
    if (days <= 5) return { text: `${days}d left`, cls: 'soon' };
    return { text: `${days}d left`, cls: 'ok' };
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = document.getElementById('list');

    let items = ALL.filter(h => {
      if (activeTheme && !h.themes.map(t => t.toLowerCase()).includes(activeTheme)) return false;
      if (!q) return true;
      const haystack = (h.title + ' ' + h.themes.join(' ')).toLowerCase();
      return haystack.includes(q);
    });

    document.getElementById('count-line').textContent =
      `${items.length} of ${ALL.length} hackathon${ALL.length === 1 ? '' : 's'}`;

    if (items.length === 0) {
      list.innerHTML = '<div class="empty">Nothing matches. Try a different search or clear the theme filter.</div>';
      return;
    }

    list.innerHTML = items.map(h => {
      const dl = deadlineLabel(h.deadline);
      const meta = [h.mode, h.location, h.prize_text].filter(Boolean).join(' · ');
      const tags = h.themes.slice(0, 5).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      return `
        <div class="row">
          <a class="row-title" href="${escapeAttr(h.url)}" target="_blank" rel="noopener">${escapeHtml(h.title)}</a>
          <div class="row-deadline ${dl.cls}">${dl.text}</div>
          <div class="row-meta">${escapeHtml(meta)}</div>
          <div class="tags">${tags}</div>
        </div>`;
    }).join('');
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function buildChips() {
    const counts = {};
    ALL.forEach(h => h.themes.forEach(t => {
      const key = t.toLowerCase();
      counts[key] = (counts[key] || 0) + 1;
    }));
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const container = document.getElementById('theme-chips');
    container.innerHTML = top.map(([theme]) =>
      `<button class="chip" data-theme="${escapeAttr(theme)}">${escapeHtml(theme)}</button>`
    ).join('');
    container.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.theme;
        activeTheme = activeTheme === theme ? null : theme;
        container.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.theme === activeTheme));
        render();
      });
    });
  }

  fetch('hackathons.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      ALL = data.hackathons || [];
      const gen = document.getElementById('generated-at');
      if (data.generated_at) {
        gen.textContent = new Date(data.generated_at).toLocaleString();
      }
      buildChips();
      render();
    })
    .catch(() => {
      document.getElementById('list').innerHTML =
        '<div class="empty">Could not load hackathons.json — has the GitHub Action run yet?</div>';
    });

  document.getElementById('search').addEventListener('input', render);
</script>
</body>
</html>
